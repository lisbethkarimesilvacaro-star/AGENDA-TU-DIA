name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Full Flutter App Structure
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.agendatudia agenda_tu_dia
          cp -r agenda_tu_dia/android ../
          cd ..
          rm -rf temp_app

      - name: Get Dependencies
        run: flutter pub get

 

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaTuDia-APK
          path: build/app/outputs/flutter-apk/app-release.apk
